<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<title>QLD DCA 대시보드</title>
<style>
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: #f2f2f7;
  color: #1d1d1f;
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }
button { font-family: inherit; cursor: pointer; }

/* ── Hero ──────────────────────────────────────────── */
.hero-card {
  margin-bottom: 10px;
  text-align: center;
  transition: background .7s ease;
  padding: 28px 18px 22px;
}
.hero-eyebrow {
  font-size: 12px;
  font-weight: 600;
  color: #86868b;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.hero-score {
  font-size: clamp(72px, 22vw, 110px);
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 1;
  margin: 0 0 4px;
  transition: color .7s ease;
  font-variant-numeric: tabular-nums;
}
.hero-score sup {
  font-size: 0.28em;
  font-weight: 600;
  letter-spacing: 0;
  opacity: .55;
  vertical-align: super;
}
.hero-tier {
  font-size: clamp(22px, 6.5vw, 30px);
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 6px 0 4px;
  transition: color .7s ease;
}
.hero-desc {
  font-size: 14px;
  color: #6e6e73;
  margin: 0 0 20px;
}
.badge-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  border-radius: 999px;
  background: rgba(255,255,255,.85);
  border: 1px solid rgba(0,0,0,.08);
  font-size: 12px;
  font-weight: 600;
  color: #1d1d1f;
  backdrop-filter: blur(8px);
}
button.pill { transition: opacity .15s; }
button.pill:disabled { opacity: .55; cursor: default; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.live  { background: #34c759; animation: pulse 2s infinite; }
.dot.partial { background: #ff9f0a; }
.dot.fail  { background: #ff3b30; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(52,199,89,.6); }
  70%  { box-shadow: 0 0 0 9px rgba(52,199,89,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); }
}

/* ── Alert ─────────────────────────────────────────── */
.alert {
  max-width: 900px; margin: 0 auto 8px;
  padding: 10px 16px;
  background: #fff1f0; border: 1px solid #ffc9c9;
  color: #a3000a; border-radius: 12px; font-size: 12px;
}
.alert ul { margin: 4px 0 0; padding-left: 16px; }

/* ── Sections ──────────────────────────────────────── */
.section { max-width: 900px; margin: 0 auto; padding: 0 14px 14px; }
@media (min-width: 720px) { .section { padding: 0 24px 16px; } }

/* ── Card base ─────────────────────────────────────── */
.card {
  background: #fff;
  border-radius: 20px;
  padding: 18px;
  border: 1px solid rgba(0,0,0,.06);
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}

/* ── Score card ────────────────────────────────────── */
.score-card { margin-bottom: 10px; }
.score-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}
.score-header .lbl {
  font-size: 11px;
  font-weight: 700;
  color: #86868b;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.score-num {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  transition: color .6s;
}
.score-num span {
  font-size: 14px;
  font-weight: 500;
  opacity: .5;
  letter-spacing: 0;
}

/* ── Progress bar ──────────────────────────────────── */
.bar { width: 100%; height: 6px; background: #f0f0f3; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.16,1,.3,1); }

/* ── Score breakdown ───────────────────────────────── */
.breakdown {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bd-item { display: flex; align-items: center; gap: 10px; }
.bd-lbl  { font-size: 13px; font-weight: 600; flex: 0 0 auto; width: 115px; }
.bd-bar  { flex: 1; height: 5px; background: #f0f0f3; border-radius: 999px; overflow: hidden; }
.bd-bar > i { display: block; height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.16,1,.3,1); }
.bd-meta {
  flex: 0 0 auto;
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}
.bd-score { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bd-w     { font-size: 10px; color: #aeaeb2; font-weight: 500; }

.formula {
  margin-top: 14px;
  padding: 10px 12px;
  background: #f5f5f7;
  border-radius: 10px;
  font-size: 12px;
  color: #6e6e73;
  text-align: center;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
}

/* ── Metrics grid ──────────────────────────────────── */
.grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.metric-card .m-lbl {
  font-size: 11px; font-weight: 700; color: #86868b;
  text-transform: uppercase; letter-spacing: .07em;
}
.metric-card .m-val {
  font-size: clamp(32px, 9vw, 42px);
  font-weight: 800;
  letter-spacing: -.035em;
  margin: 8px 0 4px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: color .5s;
}
.metric-card .m-bar { margin: 8px 0 6px; }
.metric-card .m-sub { font-size: 13px; color: #6e6e73; }
.metric-card .m-foot {
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #aeaeb2;
}

/* ── Strategy section ──────────────────────────────── */
.strategy h2 {
  font-size: clamp(20px, 5vw, 26px);
  font-weight: 800;
  letter-spacing: -.03em;
  margin: 4px 0 4px;
}
.strategy .lead {
  font-size: 13px;
  color: #6e6e73;
  line-height: 1.55;
  margin: 0 0 16px;
}

/* ── Recommendation card ───────────────────────────── */
.rec-card {
  background: #1c1c1e;
  color: #fff;
  border-radius: 22px;
  padding: 22px 20px 20px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.rec-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 70% 0%, rgba(255,255,255,.04) 0%, transparent 60%);
  pointer-events: none;
}
.rec-lbl {
  font-size: 11px;
  font-weight: 700;
  opacity: .55;
  text-transform: uppercase;
  letter-spacing: .12em;
  text-align: center;
  margin-bottom: 2px;
}
.rec-amount {
  font-size: clamp(36px, 10vw, 52px);
  font-weight: 800;
  letter-spacing: -.04em;
  text-align: center;
  margin: 10px 0 18px;
  font-variant-numeric: tabular-nums;
  transition: color .5s;
}
.rec-break {
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.rec-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; gap: 12px; }
.rec-row .rk { opacity: .65; }
.rec-row .rv { font-weight: 600; font-variant-numeric: tabular-nums; }
.rec-extra .rv { color: #32d74b; font-weight: 800; }
.rec-total {
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: 10px;
  margin-top: 4px;
  font-weight: 800;
  font-size: 17px;
}
.rec-meta {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.rec-meta-box {
  flex: 1;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
}
.rec-meta-k { font-size: 11px; opacity: .6; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
.rec-meta-v { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ── Tier list ─────────────────────────────────────── */
.tier-list { display: flex; flex-direction: column; gap: 8px; }
.tier-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-radius: 16px;
  background: #fff;
  border: 1.5px solid #ececf0;
  transition: border-color .3s, background .3s;
}
.tier-row.active { border-width: 2px; }
.tier-left { display: flex; align-items: center; gap: 12px; }
.tier-icon { font-size: 22px; line-height: 1; }
.tier-name { font-size: 14px; font-weight: 700; }
.tier-sub  { font-size: 11px; color: #aeaeb2; margin-top: 2px; font-weight: 500; }
.tier-extra { font-size: 15px; font-weight: 800; color: #aeaeb2; }
.tier-row.active .tier-extra { font-weight: 800; }

/* ── Footer ────────────────────────────────────────── */
.foot {
  text-align: center;
  color: #aeaeb2;
  font-size: 12px;
  padding: 24px 16px 44px;
  line-height: 1.8;
}

/* ── Note card (데이터 출처/유의) ───────────────────── */
.note-card { margin-top: 4px; }
.note-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid rgba(0,0,0,.05);
  font-size: 12.5px;
}
.note-row:first-child { padding-top: 2px; }
.note-row:last-child { border-bottom: none; padding-bottom: 2px; }
.note-row .nk {
  flex: 0 0 auto;
  color: #86868b;
  font-weight: 700;
  letter-spacing: .02em;
}
.note-row .nv {
  flex: 1;
  text-align: right;
  color: #1d1d1f;
  font-weight: 500;
}

/* ── Skeleton shimmer ──────────────────────────────── */
@keyframes shimmer {
  0%   { background-position: -400% 0; }
  100% { background-position: 400% 0; }
}
.skel {
  display: inline-block;
  border-radius: 6px;
  background: linear-gradient(90deg, #e5e5ea 25%, #d8d8de 50%, #e5e5ea 75%);
  background-size: 400% 100%;
  animation: shimmer 1.6s ease infinite;
  color: transparent !important;
  user-select: none;
}

/* ── Hero amount (오늘 투자금) ──────────────────────── */
.hero-amount {
  font-size: clamp(46px, 14vw, 72px);
  font-weight: 800;
  letter-spacing: -.045em;
  line-height: 1;
  margin: 4px 0 8px;
  font-variant-numeric: tabular-nums;
  transition: color .7s ease;
}
.hero-scoreline {
  font-size: 13px;
  color: #6e6e73;
  margin: 2px 0 18px;
  font-variant-numeric: tabular-nums;
}

/* ── DCA control / evaluation ─────────────────────── */
.dca-control {
  margin-bottom: 12px;
}
.dca-control h3 {
  font-size: 16px; margin: 0 0 6px; font-weight: 800;
}
.dca-control .hint {
  font-size: 12px; color: #6e6e73; line-height: 1.5; margin-bottom: 12px;
}
.dca-input-row {
  display: flex; align-items: center; gap: 8px;
}
.dca-input {
  flex: 1; min-width: 0; border: 1px solid #d8d8de; background: #f5f5f7;
  border-radius: 12px; padding: 12px 13px; font-size: 18px; font-weight: 800;
  font-family: inherit; color: #1d1d1f; outline: none;
}
.dca-input:focus { border-color: #0071e3; background: #fff; }
.dca-unit { font-size: 14px; color: #6e6e73; font-weight: 700; }
.strategy-eval {
  margin-bottom: 12px; background: #f5f5f7; border-radius: 16px; padding: 14px;
}
.strategy-eval .eval-title { font-size: 13px; font-weight: 800; margin-bottom: 8px; }
.eval-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
.eval-box { background:#fff; border-radius:12px; padding:10px 8px; text-align:center; border:1px solid rgba(0,0,0,.05); }
.eval-k { display:block; font-size:10px; color:#86868b; margin-bottom:4px; }
.eval-v { display:block; font-size:14px; font-weight:800; }
@media (max-width: 420px) {
  .eval-grid { grid-template-columns: 1fr; }
}

</style>

<body>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   QLD Fear Dashboard v9
   데이터: Anthropic API + web_search (CORS 프록시 폴백)
   알고리즘: NDX 하락률(50%) + VIX(30%) + Fear&Greed(20%) → 점수별 적립배수 (기본금 입력, 최대 ×3)
   ═══════════════════════════════════════════════════════════════ */

// ── 시장 등급 정의 ────────────────────────────────────────────
const DEFAULT_DAILY = 15000;
const MAX_MULT = 3.0;

// 공포가 깊어질수록 증액하되, QLD 자체가 2배 레버리지이므로 최대 ×3으로 제한
const TIERS = [
  { min:  0, max: 40,  label: "평온",        icon: "☀️", color: "#0a84ff", bg: "#eaf4ff", bc: "#b8dcff", mult: 1.0, desc: "기본 적립" },
  { min: 40, max: 52,  label: "약한 공포",   icon: "🌤️", color: "#17b9b0", bg: "#e4faf8", bc: "#a9e9e4", mult: 1.5, desc: "소폭 증액" },
  { min: 52, max: 62,  label: "공포",        icon: "⛅", color: "#34c759", bg: "#e9fbef", bc: "#aee9c1", mult: 2.0, desc: "공포 매수" },
  { min: 62, max: 72,  label: "강한 공포",   icon: "☁️", color: "#a0c61a", bg: "#f4fae0", bc: "#dceaa6", mult: 2.5, desc: "적극 매수" },
  { min: 72, max: 82,  label: "깊은 공포",   icon: "🌧️", color: "#ffcc00", bg: "#fff8df", bc: "#ffe999", mult: 3.0, desc: "공격 매수" },
  { min: 82, max: 92,  label: "극단적 공포", icon: "⛈️", color: "#ff9500", bg: "#fff2e0", bc: "#ffd6a3", mult: 3.0, desc: "최대 ×3 유지" },
  { min: 92, max: 101, label: "패닉·투매",   icon: "🌪️", color: "#ff3b30", bg: "#ffece9", bc: "#ffc2bd", mult: 3.0, desc: "최대 ×3 유지" },
];

function getDailyBase() {
  const raw = Number(localStorage.getItem("qldDailyBase"));
  return Number.isFinite(raw) && raw >= 1000 ? Math.round(raw / 1000) * 1000 : DEFAULT_DAILY;
}
function tierAmount(t) {
  return Math.round((getDailyBase() * Math.min(t.mult, MAX_MULT)) / 1000) * 1000;
}

// ── DCA 알고리즘 ──────────────────────────────────────────────
function fgScore(fg) {
  if (fg == null) return 50;
  return 100 - fg;            // 역산: 낮은 F&G = 높은 공포 = 높은 점수
}
function vixScore(vix) {
  if (vix == null) return 50;
  if (vix >= 45) return 100;
  if (vix >= 35) return 90;
  if (vix >= 30) return 80;
  if (vix >= 25) return 65;
  if (vix >= 20) return 50;
  return 20;
}
function ndxScore(dd) {
  if (dd == null) return 50;
  if (dd <= -40) return 100;
  if (dd <= -30) return 95;
  if (dd <= -20) return 85;
  if (dd <= -15) return 75;
  if (dd <= -10) return 60;
  if (dd <=  -5) return 40;
  return 20;
}
function calcScore(fg, vix, dd) {
  const fgS = fgScore(fg), vixS = vixScore(vix), ndxS = ndxScore(dd);
  let total = Math.round(fgS * 0.20 + vixS * 0.30 + ndxS * 0.50);
  // 극단적 공포 오버라이드
  if (fg != null && fg < 20 && dd != null && dd <= -15) total = Math.max(total, 90);
  return { total, fgS, vixS, ndxS };
}
function getTier(total) {
  return TIERS.find(t => total >= t.min && total < t.max) || TIERS[2];
}
function calcRec(fg, vix, dd, price, ma50, ma200) {
  const score = calcScore(fg, vix, dd);
  const tier  = getTier(score.total);
  const baseline = getDailyBase();

  const structuralDowntrend =
    Number.isFinite(price) && Number.isFinite(ma50) && Number.isFinite(ma200) &&
    price < ma200 && ma50 < ma200;

  const effectiveMult = structuralDowntrend
    ? Math.min(tier.mult, 2.0)
    : Math.min(tier.mult, MAX_MULT);

  const total = Math.round((baseline * effectiveMult) / 1000) * 1000;

  return {
    baseline,
    extra: total - baseline,
    mult: effectiveMult,
    rawMult: tier.mult,
    total,
    score,
    tier,
    structuralDowntrend
  };
}

// // ── 포맷터 ───────────────────────────────────────────────────
const krw    = n => Math.round(n).toLocaleString("ko-KR") + "원";
const fgCol  = v => v==null?"#aeaeb2":v<25?"#34c759":v<45?"#30d158":v<55?"#0071e3":v<75?"#ff9f0a":"#ff3b30";
const vixCol = v => v==null?"#aeaeb2":v>=35?"#ff3b30":v>=25?"#ff9f0a":v>=18?"#0071e3":"#34c759";
const ddCol  = v => v==null?"#aeaeb2":v<=-20?"#ff3b30":v<=-10?"#ff9f0a":v<=-5?"#0071e3":"#34c759";
const fgKo   = l => ({"extreme fear":"극단적 공포","fear":"공포","neutral":"중립","greed":"탐욕","extreme greed":"극단적 탐욕"})[String(l||"").toLowerCase()]||l||"—";

// ── 상태 ─────────────────────────────────────────────────────
let refreshing = false;
function safeLS(key, fallback) {
  try { return localStorage.getItem(key); } catch { return fallback; }
}
function setLS(key, val) { try { localStorage.setItem(key, val); } catch {} }

const state = {
  loading: true, lastUpdate: null,
  fg: null, vix: null, ndx: null,
  errors: [], dataSource: null,
};

// ── JSON 추출 ─────────────────────────────────────────────────
function extractJSON(text) {
  const clean = text.replace(/```(?:json)?\s*/gi, "").replace(/```/g, "").trim();
  try { return JSON.parse(clean); } catch {}
  const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
  if (s !== -1 && e > s) { try { return JSON.parse(clean.slice(s, e + 1)); } catch {} }
  throw new Error("JSON 파싱 실패");
}

// ── Anthropic API (web_search) ────────────────────────────────
async function fetchViaAI() {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 600,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      system: `You are a financial data assistant. Search for today's current market data.
Return ONLY a single-line valid JSON object, no other text, no markdown:
{"vix":NUMBER,"fearGreed":NUMBER,"fearGreedLabel":"STRING","ndx":NUMBER,"ndx52High":NUMBER,"ndx50MA":NUMBER,"ndx200MA":NUMBER}
vix = CBOE VIX current value. fearGreed = CNN Fear & Greed Index 0-100 integer. fearGreedLabel = one of: extreme fear, fear, neutral, greed, extreme greed. ndx = NASDAQ-100 current price. ndx52High = NASDAQ-100 52-week high.`,
      messages: [{
        role: "user",
        content: "Find current: VIX value, CNN Fear & Greed Index score + label, NASDAQ-100 price, 52-week high, 50-day moving average and 200-day moving average. Return only JSON."
      }]
    })
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "API 오류");
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  const j = extractJSON(text);
  const vix  = Number(j.vix);
  const fg   = Number(j.fearGreed);
  const ndx  = Number(j.ndx);
  const hi52 = Number(j.ndx52High);
  const ma50 = Number(j.ndx50MA);
  const ma200 = Number(j.ndx200MA);
  if (!vix || !fg || !ndx || !hi52 || !ma50 || !ma200) throw new Error("필드 누락: " + text.slice(0, 120));
  return {
    fg:  { value: fg,  label: j.fearGreedLabel || "", source: "CNN · AI" },
    vix: { value: vix, source: "CBOE · AI" },
    ndx: { value: ndx, high52: hi52, drawdown: (ndx / hi52 - 1) * 100, ma50, ma200, source: "NASDAQ · AI" },
  };
}

// ── CORS 프록시 폴백 ──────────────────────────────────────────
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];
async function proxyFetch(url, asText = false, ms = 9000) {
  for (const wrap of PROXIES) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), ms);
      const r = await fetch(wrap(url), { signal: ctl.signal, headers: { Accept: "*/*" } });
      clearTimeout(t);
      if (!r.ok) continue;
      // content-type 이 깨져도 안전하도록 항상 text 로 받아 직접 파싱
      const body = await r.text();
      if (!body) continue;
      if (asText) return body;
      try { return JSON.parse(body); } catch { continue; }
    } catch { continue; }
  }
  throw new Error("모든 프록시 실패");
}

async function fetchFGFallback() {
  // CNN 엔드포인트는 브라우저 UA 없으면 418/403 차단 →
  //  ① 날짜 suffix URL 우선  ② allorigins /get(서버측 브라우저 UA 대행)로 우회
  const today = new Date().toISOString().slice(0, 10);
  const targets = [
    `https://production.dataviz.cnn.io/index/fearandgreed/graphdata/${today}`,
    `https://production.dataviz.cnn.io/index/fearandgreed/graphdata`,
  ];
  let lastErr = "";
  for (const target of targets) {
    const variants = [
      // 일반 프록시 순회 (allorigins/raw → codetabs → corsproxy → thingproxy)
      () => proxyFetch(target),
      // allorigins /get : { contents } 래핑 응답 → UA 차단을 가장 잘 우회
      async () => {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 9000);
        const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`, { signal: ctl.signal });
        clearTimeout(t);
        if (!r.ok) throw new Error("allorigins " + r.status);
        const w = await r.json();
        return typeof w?.contents === "string" ? JSON.parse(w.contents) : w;
      },
    ];
    for (const get of variants) {
      try {
        const j = await get();
        const f = j?.fear_and_greed;
        if (f && f.score != null) {
          return { value: Math.round(f.score), label: f.rating, source: "CNN · 프록시" };
        }
        lastErr = "CNN 응답 형식 오류";
      } catch (e) { lastErr = e?.message || String(e); }
    }
  }
  throw new Error(lastErr || "CNN 데이터 없음");
}
async function fetchVIXFallback() {
  const j = await proxyFetch("https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?interval=1d&range=5d");
  const px = j?.chart?.result?.[0]?.meta?.regularMarketPrice;
  if (px) return { value: Number(px), source: "CBOE · 프록시" };
  throw new Error("VIX 값 없음");
}
async function fetchNDXFallback() {
  const j = await proxyFetch("https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX?interval=1d&range=1y");
  const r = j?.chart?.result?.[0];
  const cl = (r?.indicators?.quote?.[0]?.close || []).filter(Boolean);
  const price = r?.meta?.regularMarketPrice ?? cl.at(-1);
  const hi52  = r?.meta?.fiftyTwoWeekHigh    ?? Math.max(...cl);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const ma50 = avg(cl.slice(-50));
  const ma200 = avg(cl.slice(-200));
  if (price && hi52 && ma50 && ma200) return {
    value: Number(price), high52: Number(hi52),
    drawdown: (price/hi52-1)*100, ma50, ma200,
    source: "NASDAQ · 프록시"
  };
  throw new Error("NDX 값 없음");
}

// ── 데이터 로드 ───────────────────────────────────────────────
async function loadAll() {
  if (refreshing) return;
  refreshing = true;
  state.loading = true;
  state.errors  = [];
  render();

  // 1차: Anthropic AI
  try {
    const d = await fetchViaAI();
    state.fg  = d.fg;
    state.vix = d.vix;
    state.ndx = d.ndx;
    state.dataSource = "ai";
  } catch (aiErr) {
    console.warn("[AI fetch failed]", aiErr.message);
    // 2차: CORS 프록시 폴백
    const [r1, r2, r3] = await Promise.allSettled([
      fetchFGFallback(), fetchVIXFallback(), fetchNDXFallback()
    ]);
    const errs = [];
    if (r1.status === "fulfilled") state.fg  = r1.value; else { state.fg  = null; errs.push("F&G: " + r1.reason?.message); }
    if (r2.status === "fulfilled") state.vix = r2.value; else { state.vix = null; errs.push("VIX: " + r2.reason?.message); }
    if (r3.status === "fulfilled") state.ndx = r3.value; else { state.ndx = null; errs.push("NDX: " + r3.reason?.message); }
    state.errors = errs;
    state.dataSource = "proxy";
  }

  state.loading    = false;
  state.lastUpdate = Date.now();
  refreshing = false;
  render();
}
