<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<title>QLD DCA 대시보드</title>
<style>
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: #f2f2f7;
  color: #1d1d1f;
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }
button { font-family: inherit; cursor: pointer; }

/* ── Hero ──────────────────────────────────────────── */
.hero {
  padding: 36px 20px 28px;
  text-align: center;
  transition: background .7s ease;
}
.hero-eyebrow {
  font-size: 12px;
  font-weight: 600;
  color: #86868b;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.hero-score {
  font-size: clamp(72px, 22vw, 110px);
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 1;
  margin: 0 0 4px;
  transition: color .7s ease;
  font-variant-numeric: tabular-nums;
}
.hero-score sup {
  font-size: 0.28em;
  font-weight: 600;
  letter-spacing: 0;
  opacity: .55;
  vertical-align: super;
}
.hero-tier {
  font-size: clamp(22px, 6.5vw, 30px);
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 6px 0 4px;
  transition: color .7s ease;
}
.hero-desc {
  font-size: 14px;
  color: #6e6e73;
  margin: 0 0 20px;
}
.badge-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  border-radius: 999px;
  background: rgba(255,255,255,.85);
  border: 1px solid rgba(0,0,0,.08);
  font-size: 12px;
  font-weight: 600;
  color: #1d1d1f;
  backdrop-filter: blur(8px);
}
button.pill { transition: opacity .15s; }
button.pill:disabled { opacity: .55; cursor: default; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.live  { background: #34c759; animation: pulse 2s infinite; }
.dot.partial { background: #ff9f0a; }
.dot.fail  { background: #ff3b30; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(52,199,89,.6); }
  70%  { box-shadow: 0 0 0 9px rgba(52,199,89,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); }
}

/* ── Alert ─────────────────────────────────────────── */
.alert {
  max-width: 900px; margin: 0 auto 8px;
  padding: 10px 16px;
  background: #fff1f0; border: 1px solid #ffc9c9;
  color: #a3000a; border-radius: 12px; font-size: 12px;
}
.alert ul { margin: 4px 0 0; padding-left: 16px; }

/* ── Sections ──────────────────────────────────────── */
.section { max-width: 900px; margin: 0 auto; padding: 0 14px 14px; }
@media (min-width: 720px) { .section { padding: 0 24px 16px; } }

/* ── Card base ─────────────────────────────────────── */
.card {
  background: #fff;
  border-radius: 20px;
  padding: 18px;
  border: 1px solid rgba(0,0,0,.06);
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}

/* ── Score card ────────────────────────────────────── */
.score-card { margin-bottom: 10px; }
.score-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}
.score-header .lbl {
  font-size: 11px;
  font-weight: 700;
  color: #86868b;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.score-num {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  transition: color .6s;
}
.score-num span {
  font-size: 14px;
  font-weight: 500;
  opacity: .5;
  letter-spacing: 0;
}

/* ── Progress bar ──────────────────────────────────── */
.bar { width: 100%; height: 6px; background: #f0f0f3; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.16,1,.3,1); }

/* ── Score breakdown ───────────────────────────────── */
.breakdown {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bd-item { display: flex; align-items: center; gap: 10px; }
.bd-lbl  { font-size: 13px; font-weight: 600; flex: 0 0 auto; width: 115px; }
.bd-bar  { flex: 1; height: 5px; background: #f0f0f3; border-radius: 999px; overflow: hidden; }
.bd-bar > i { display: block; height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.16,1,.3,1); }
.bd-meta {
  flex: 0 0 auto;
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}
.bd-score { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bd-w     { font-size: 10px; color: #aeaeb2; font-weight: 500; }

.formula {
  margin-top: 14px;
  padding: 10px 12px;
  background: #f5f5f7;
  border-radius: 10px;
  font-size: 12px;
  color: #6e6e73;
  text-align: center;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
}

/* ── Metrics grid ──────────────────────────────────── */
.grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.metric-card .m-lbl {
  font-size: 11px; font-weight: 700; color: #86868b;
  text-transform: uppercase; letter-spacing: .07em;
}
.metric-card .m-val {
  font-size: clamp(32px, 9vw, 42px);
  font-weight: 800;
  letter-spacing: -.035em;
  margin: 8px 0 4px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: color .5s;
}
.metric-card .m-bar { margin: 8px 0 6px; }
.metric-card .m-sub { font-size: 13px; color: #6e6e73; }
.metric-card .m-foot {
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #aeaeb2;
}

/* ── Strategy section ──────────────────────────────── */
.strategy h2 {
  font-size: clamp(20px, 5vw, 26px);
  font-weight: 800;
  letter-spacing: -.03em;
  margin: 4px 0 4px;
}
.strategy .lead {
  font-size: 13px;
  color: #6e6e73;
  line-height: 1.55;
  margin: 0 0 16px;
}

/* ── Input box ─────────────────────────────────────── */
.invest-box {
  background: #f5f5f7;
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.invest-box label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: #86868b;
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 8px;
}
.invest-input {
  width: 100%;
  padding: 12px 14px;
  font-size: 22px;
  font-weight: 700;
  border: 1.5px solid #d1d1d6;
  border-radius: 12px;
  background: #fff;
  color: #1d1d1f;
  outline: none;
  font-variant-numeric: tabular-nums;
  transition: border-color .2s;
}
.invest-input:focus { border-color: #0071e3; }
.invest-hint { font-size: 12px; color: #aeaeb2; margin-top: 6px; }

/* ── Recommend card ────────────────────────────────── */
.rec-card {
  background: #1c1c1e;
  color: #fff;
  border-radius: 22px;
  padding: 22px 20px 20px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.rec-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 70% 0%, rgba(255,255,255,.04) 0%, transparent 60%);
  pointer-events: none;
}
.rec-lbl {
  font-size: 11px;
  font-weight: 700;
  opacity: .6;
  text-transform: uppercase;
  letter-spacing: .1em;
  text-align: center;
}
.rec-amount {
  font-size: clamp(36px, 10vw, 52px);
  font-weight: 800;
  letter-spacing: -.04em;
  text-align: center;
  margin: 10px 0 18px;
  font-variant-numeric: tabular-nums;
  transition: color .5s;
}
.rec-break {
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.rec-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.rec-row .rk { opacity: .65; }
.rec-row .rv { font-weight: 600; font-variant-numeric: tabular-nums; }
.rec-extra .rv { color: #32d74b; font-weight: 800; }
.rec-total {
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: 10px;
  margin-top: 4px;
  font-weight: 800;
  font-size: 17px;
}
.rec-meta {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.rec-meta-box {
  flex: 1;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
}
.rec-meta-k { font-size: 11px; opacity: .6; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
.rec-meta-v { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ── Tier list ─────────────────────────────────────── */
.tier-list { display: flex; flex-direction: column; gap: 8px; }
.tier-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-radius: 16px;
  background: #fff;
  border: 1.5px solid #ececf0;
  transition: border-color .3s, background .3s;
}
.tier-row.active { border-width: 2px; }
.tier-left { display: flex; align-items: center; gap: 12px; }
.tier-icon { font-size: 22px; line-height: 1; }
.tier-name { font-size: 14px; font-weight: 700; }
.tier-sub  { font-size: 11px; color: #aeaeb2; margin-top: 2px; font-weight: 500; }
.tier-extra { font-size: 15px; font-weight: 800; color: #aeaeb2; }
.tier-row.active .tier-extra { font-weight: 800; }

/* ── Footer ────────────────────────────────────────── */
.foot {
  text-align: center;
  color: #aeaeb2;
  font-size: 12px;
  padding: 24px 16px 44px;
  line-height: 1.8;
}

/* ── Skeleton shimmer ──────────────────────────────── */
@keyframes shimmer {
  0%   { background-position: -400% 0; }
  100% { background-position: 400% 0; }
}
.skel {
  display: inline-block;
  border-radius: 6px;
  background: linear-gradient(90deg, #e5e5ea 25%, #d8d8de 50%, #e5e5ea 75%);
  background-size: 400% 100%;
  animation: shimmer 1.6s ease infinite;
  color: transparent !important;
  user-select: none;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   QLD Fear Dashboard v8
   데이터: Anthropic API + web_search (CORS 프록시 폴백)
   알고리즘: VIX(30%) + Fear&Greed(20%) + NDX 하락률(50%)
   ═══════════════════════════════════════════════════════════════ */

// ── 시장 등급 정의 ────────────────────────────────────────────
const TIERS = [
  { min:  0, max: 20,  label: "과열",        icon: "🔥", color: "#ff3b30", bg: "#fff1f0", bc: "#ffccc9", extra:      0, desc: "추가매수 없음" },
  { min: 20, max: 40,  label: "경계",        icon: "⚠️", color: "#ff9f0a", bg: "#fff8f0", bc: "#ffd4a0", extra:      0, desc: "기본 적립 유지" },
  { min: 40, max: 60,  label: "중립",        icon: "😐", color: "#0071e3", bg: "#f0f8ff", bc: "#b3d7ff", extra:      0, desc: "기본 적립 유지" },
  { min: 60, max: 80,  label: "매수 강화",   icon: "📈", color: "#30d158", bg: "#f0fff5", bc: "#b0f0c8", extra: 150000, desc: "공포 확대 구간" },
  { min: 80, max: 101, label: "공격적 매수", icon: "💚", color: "#25a244", bg: "#e8ffe8", bc: "#88e0a0", extra: 350000, desc: "극단적 공포 구간" },
];

// ── DCA 알고리즘 ──────────────────────────────────────────────
function fgScore(fg) {
  if (fg == null) return 50;
  return 100 - fg;            // 역산: 낮은 F&G = 높은 공포 = 높은 점수
}
function vixScore(vix) {
  if (vix == null) return 50;
  if (vix >= 45) return 100;
  if (vix >= 35) return 90;
  if (vix >= 30) return 80;
  if (vix >= 25) return 65;
  if (vix >= 20) return 50;
  return 20;
}
function ndxScore(dd) {
  if (dd == null) return 50;
  if (dd <= -40) return 100;
  if (dd <= -30) return 95;
  if (dd <= -20) return 85;
  if (dd <= -15) return 75;
  if (dd <= -10) return 60;
  if (dd <=  -5) return 40;
  return 20;
}
function calcScore(fg, vix, dd) {
  const fgS = fgScore(fg), vixS = vixScore(vix), ndxS = ndxScore(dd);
  let total = Math.round(fgS * 0.20 + vixS * 0.30 + ndxS * 0.50);
  // 극단적 공포 오버라이드
  if (fg != null && fg < 20 && dd != null && dd <= -15) total = Math.max(total, 90);
  return { total, fgS, vixS, ndxS };
}
function getTier(total) {
  return TIERS.find(t => total >= t.min && total < t.max) || TIERS[2];
}
function calcRec(base, fg, vix, dd) {
  const score = calcScore(fg, vix, dd);
  const tier  = getTier(score.total);
  return {
    baseline:      base,
    extra:         tier.extra,
    total:         base + tier.extra,
    score, tier
  };
}

// ── 포맷터 ───────────────────────────────────────────────────
const krw    = n => Math.round(n).toLocaleString("ko-KR") + "원";
const fgCol  = v => v==null?"#aeaeb2":v<25?"#34c759":v<45?"#30d158":v<55?"#0071e3":v<75?"#ff9f0a":"#ff3b30";
const vixCol = v => v==null?"#aeaeb2":v>=35?"#ff3b30":v>=25?"#ff9f0a":v>=18?"#0071e3":"#34c759";
const ddCol  = v => v==null?"#aeaeb2":v<=-20?"#ff3b30":v<=-10?"#ff9f0a":v<=-5?"#0071e3":"#34c759";
const fgKo   = l => ({"extreme fear":"극단적 공포","fear":"공포","neutral":"중립","greed":"탐욕","extreme greed":"극단적 탐욕"})[String(l||"").toLowerCase()]||l||"—";

// ── 상태 ─────────────────────────────────────────────────────
let refreshing = false;
function safeLS(key, fallback) {
  try { return localStorage.getItem(key); } catch { return fallback; }
}
function setLS(key, val) { try { localStorage.setItem(key, val); } catch {} }

const state = {
  loading: true, lastUpdate: null,
  fg: null, vix: null, ndx: null,
  errors: [], dataSource: null,
  weeklyKRW: Number(safeLS("weeklyKRW") || 200000),
};

// ── JSON 추출 ─────────────────────────────────────────────────
function extractJSON(text) {
  const clean = text.replace(/```(?:json)?\s*/gi, "").replace(/```/g, "").trim();
  try { return JSON.parse(clean); } catch {}
  const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
  if (s !== -1 && e > s) { try { return JSON.parse(clean.slice(s, e + 1)); } catch {} }
  throw new Error("JSON 파싱 실패");
}

// ── Anthropic API (web_search) ────────────────────────────────
async function fetchViaAI() {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 600,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      system: `You are a financial data assistant. Search for today's current market data.
Return ONLY a single-line valid JSON object, no other text, no markdown:
{"vix":NUMBER,"fearGreed":NUMBER,"fearGreedLabel":"STRING","ndx":NUMBER,"ndx52High":NUMBER}
vix = CBOE VIX current value. fearGreed = CNN Fear & Greed Index 0-100 integer. fearGreedLabel = one of: extreme fear, fear, neutral, greed, extreme greed. ndx = NASDAQ-100 current price. ndx52High = NASDAQ-100 52-week high.`,
      messages: [{
        role: "user",
        content: "Find current: VIX value, CNN Fear & Greed Index score + label, NASDAQ-100 price and 52-week high. Return only JSON."
      }]
    })
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "API 오류");
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  const j = extractJSON(text);
  const vix  = Number(j.vix);
  const fg   = Number(j.fearGreed);
  const ndx  = Number(j.ndx);
  const hi52 = Number(j.ndx52High);
  if (!vix || !fg || !ndx || !hi52) throw new Error("필드 누락: " + text.slice(0, 80));
  return {
    fg:  { value: fg,  label: j.fearGreedLabel || "", source: "CNN · AI" },
    vix: { value: vix, source: "CBOE · AI" },
    ndx: { value: ndx, high52: hi52, drawdown: (ndx / hi52 - 1) * 100, source: "NASDAQ · AI" },
  };
}

// ── CORS 프록시 폴백 ──────────────────────────────────────────
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
];
async function proxyFetch(url, asText = false, ms = 8000) {
  for (const wrap of PROXIES) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), ms);
      const r = await fetch(wrap(url), { signal: ctl.signal, headers: { Accept: "*/*" } });
      clearTimeout(t);
      if (!r.ok) continue;
      return asText ? r.text() : r.json();
    } catch { continue; }
  }
  throw new Error("모든 프록시 실패");
}

async function fetchFGFallback() {
  const j = await proxyFetch("https://production.dataviz.cnn.io/index/fearandgreed/graphdata");
  const f = j?.fear_and_greed;
  if (!f) throw new Error("CNN 형식 오류");
  return { value: Math.round(f.score), label: f.rating, source: "CNN · 프록시" };
}
async function fetchVIXFallback() {
  const j = await proxyFetch("https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?interval=1d&range=5d");
  const px = j?.chart?.result?.[0]?.meta?.regularMarketPrice;
  if (px) return { value: Number(px), source: "CBOE · 프록시" };
  throw new Error("VIX 값 없음");
}
async function fetchNDXFallback() {
  const j = await proxyFetch("https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX?interval=1d&range=1y");
  const r = j?.chart?.result?.[0];
  const cl = (r?.indicators?.quote?.[0]?.close || []).filter(Boolean);
  const price = r?.meta?.regularMarketPrice ?? cl.at(-1);
  const hi52  = r?.meta?.fiftyTwoWeekHigh    ?? Math.max(...cl);
  if (price && hi52) return { value: Number(price), high52: Number(hi52), drawdown: (price/hi52-1)*100, source: "NASDAQ · 프록시" };
  throw new Error("NDX 값 없음");
}

// ── 데이터 로드 ───────────────────────────────────────────────
async function loadAll() {
  if (refreshing) return;
  refreshing = true;
  state.loading = true;
  state.errors  = [];
  render();

  // 1차: Anthropic AI
  try {
    const d = await fetchViaAI();
    state.fg  = d.fg;
    state.vix = d.vix;
    state.ndx = d.ndx;
    state.dataSource = "ai";
  } catch (aiErr) {
    console.warn("[AI fetch failed]", aiErr.message);
    // 2차: CORS 프록시 폴백
    const [r1, r2, r3] = await Promise.allSettled([
      fetchFGFallback(), fetchVIXFallback(), fetchNDXFallback()
    ]);
    const errs = [];
    if (r1.status === "fulfilled") state.fg  = r1.value; else { state.fg  = null; errs.push("F&G: " + r1.reason?.message); }
    if (r2.status === "fulfilled") state.vix = r2.value; else { state.vix = null; errs.push("VIX: " + r2.reason?.message); }
    if (r3.status === "fulfilled") state.ndx = r3.value; else { state.ndx = null; errs.push("NDX: " + r3.reason?.message); }
    state.errors = errs;
    state.dataSource = "proxy";
  }

  state.loading    = false;
  state.lastUpdate = Date.now();
  refreshing = false;
  render();
}

// ── 렌더 ─────────────────────────────────────────────────────
function render() {
  const { loading, fg, vix, ndx, errors, weeklyKRW, lastUpdate, dataSource } = state;
  const rec   = calcRec(weeklyKRW, fg?.value, vix?.value, ndx?.drawdown);
  const { score, tier } = rec;
  const ok    = [fg, vix, ndx].filter(Boolean).length;
  const status = loading ? "loading" : ok === 3 ? "live" : ok > 0 ? "partial" : "offline";
  const tStr  = lastUpdate
    ? new Date(lastUpdate).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit", second:"2-digit" })
    : "—";

  // Hero background
  const heroBg = loading
    ? "#f2f2f7"
    : score.total >= 60 ? `linear-gradient(160deg,${tier.bg},#fff 72%)`
    : score.total <  40 ? "linear-gradient(160deg,#fff0ef,#fff 72%)"
    : "linear-gradient(160deg,#f0f8ff,#fff 72%)";

  const scoreW = loading ? 0 : score.total;
  const tc = tier.color;

  const skl = (w = "80px", h = "1em") => `<span class="skel" style="width:${w};height:${h};border-radius:6px;">&nbsp;</span>`;

  document.getElementById("app").innerHTML = `
<!-- Hero -->
<header class="hero" style="background:${heroBg}">
  <div class="hero-eyebrow">QLD · DCA 대시보드</div>
  <div class="hero-score" style="color:${loading ? "#d1d1d6" : tc}">
    ${loading ? skl("120px","0.9em") : score.total}<sup>/100</sup>
  </div>
  <div class="hero-tier" style="color:${loading ? "#aeaeb2" : tc}">
    ${loading ? skl("140px","0.8em") : tier.icon + " " + tier.label}
  </div>
  <div class="hero-desc">${loading ? "시장 데이터를 가져오는 중…" : tier.desc}</div>
  <div class="badge-row">
    <button class="pill" id="btnRefresh" ${refreshing ? "disabled" : ""}>
      <span class="dot ${status === "live" ? "live" : status === "partial" ? "partial" : "fail"}"></span>
      ${refreshing ? "업데이트 중…" : status === "live" ? "LIVE" : status === "partial" ? "PARTIAL" : "OFFLINE"}
    </button>
    <span class="pill">⏱ ${tStr}</span>
    ${!loading ? `<span class="pill">${dataSource === "ai" ? "🤖 AI 실시간" : "🔄 프록시"}</span>` : ""}
  </div>
</header>

${errors.length ? `<div class="alert"><strong>일부 데이터 실패</strong><ul>${errors.map(e=>`<li>${e}</li>`).join("")}</ul></div>` : ""}

<!-- 통합 점수 카드 -->
<section class="section">
  <div class="card score-card">
    <div class="score-header">
      <span class="lbl">통합 공포 점수</span>
      <span class="score-num" style="color:${loading ? "#d1d1d6" : tc}">
        ${loading ? skl("60px","1em") : score.total} <span>/ 100</span>
      </span>
    </div>
    <div class="bar">
      <i style="width:${scoreW}%;background:${tc}"></i>
    </div>

    <div class="breakdown">
      <!-- Fear & Greed -->
      <div class="bd-item">
        <span class="bd-lbl">Fear & Greed</span>
        <div class="bd-bar"><i style="width:${loading ? 0 : score.fgS}%;background:${fgCol(fg?.value)}"></i></div>
        <div class="bd-meta">
          <span class="bd-score" style="color:${fgCol(fg?.value)}">${loading ? "—" : score.fgS}</span>
          <span class="bd-w">×0.20</span>
        </div>
      </div>
      <!-- VIX -->
      <div class="bd-item">
        <span class="bd-lbl">VIX</span>
        <div class="bd-bar"><i style="width:${loading ? 0 : score.vixS}%;background:${vixCol(vix?.value)}"></i></div>
        <div class="bd-meta">
          <span class="bd-score" style="color:${vixCol(vix?.value)}">${loading ? "—" : score.vixS}</span>
          <span class="bd-w">×0.30</span>
        </div>
      </div>
      <!-- NDX -->
      <div class="bd-item">
        <span class="bd-lbl">NASDAQ 하락률</span>
        <div class="bd-bar"><i style="width:${loading ? 0 : score.ndxS}%;background:${ddCol(ndx?.drawdown)}"></i></div>
        <div class="bd-meta">
          <span class="bd-score" style="color:${ddCol(ndx?.drawdown)}">${loading ? "—" : score.ndxS}</span>
          <span class="bd-w">×0.50</span>
        </div>
      </div>
    </div>

    ${!loading ? `<div class="formula">
      <strong>${score.fgS}</strong>×0.20 &nbsp;+&nbsp; <strong>${score.vixS}</strong>×0.30 &nbsp;+&nbsp; <strong>${score.ndxS}</strong>×0.50 &nbsp;=&nbsp; <strong style="color:${tc}">${score.total}</strong>
    </div>` : ""}
  </div>

  <!-- 지표 3개 -->
  <div class="grid">
    <!-- Fear & Greed -->
    <div class="card metric-card">
      <div class="m-lbl">Fear & Greed Index</div>
      <div class="m-val" style="color:${fgCol(fg?.value)}">${loading ? skl("70px","1em") : fg?.value ?? "—"}</div>
      <div class="m-bar bar"><i style="width:${fg ? fg.value : 0}%;background:${fgCol(fg?.value)}"></i></div>
      <div class="m-sub">${loading ? skl("100px") : fg ? fgKo(fg.label) : "데이터 없음"}</div>
      <div class="m-foot">
        <span>${fg?.source ?? "—"}</span>
        <span>점수 <strong>${loading ? "—" : score.fgS}</strong></span>
      </div>
    </div>

    <!-- VIX -->
    <div class="card metric-card">
      <div class="m-lbl">VIX 변동성</div>
      <div class="m-val" style="color:${vixCol(vix?.value)}">${loading ? skl("70px","1em") : vix ? vix.value.toFixed(1) : "—"}</div>
      <div class="m-bar bar"><i style="width:${vix ? Math.min(100, vix.value / 60 * 100) : 0}%;background:${vixCol(vix?.value)}"></i></div>
      <div class="m-sub">${loading ? skl("80px") : vix ? (vix.value < 20 ? "저변동" : vix.value < 30 ? "보통" : vix.value < 40 ? "고변동" : "극단적 변동") : "데이터 없음"}</div>
      <div class="m-foot">
        <span>${vix?.source ?? "—"}</span>
        <span>점수 <strong>${loading ? "—" : score.vixS}</strong></span>
      </div>
    </div>

    <!-- NASDAQ-100 -->
    <div class="card metric-card">
      <div class="m-lbl">NASDAQ-100</div>
      <div class="m-val" style="color:${ddCol(ndx?.drawdown)}">${loading ? skl("80px","1em") : ndx ? ndx.value.toLocaleString("en-US", {maximumFractionDigits:0}) : "—"}</div>
      <div class="m-bar bar"><i style="width:${ndx?.drawdown != null ? Math.min(100, Math.abs(ndx.drawdown) / 45 * 100) : 0}%;background:${ddCol(ndx?.drawdown)}"></i></div>
      <div class="m-sub" style="color:${ddCol(ndx?.drawdown)}">${loading ? skl("110px") : ndx?.drawdown != null ? "고점 대비 " + ndx.drawdown.toFixed(1) + "%" : "데이터 없음"}</div>
      <div class="m-foot">
        <span>${ndx?.source ?? "—"}</span>
        <span>점수 <strong>${loading ? "—" : score.ndxS}</strong></span>
      </div>
    </div>
  </div>
</section>

<!-- DCA 전략 -->
<section class="section strategy">
  <h2>이번 주 QLD 적립액</h2>
  <p class="lead">VIX(30%) + Fear&Greed(20%) + NASDAQ 하락률(50%) 가중합산 → 공포 구간에서만 추가 매수</p>

  <div class="invest-box">
    <label for="inp-weekly">주간 기본 투자금</label>
    <input id="inp-weekly" class="invest-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" step="10000" value="${weeklyKRW}" />
    <div class="invest-hint">매주 시장과 무관하게 투자하는 기본 금액 (원)</div>
  </div>

  <div class="rec-card">
    <div class="rec-lbl">이번 주 QLD 매수 권장액</div>
    <div class="rec-amount" id="rec-amount" style="color:${loading ? "rgba(255,255,255,.3)" : tc}">${loading ? "···" : krw(rec.total)}</div>

    <div class="rec-break">
      <div class="rec-row">
        <span class="rk">기본 적립액</span>
        <span class="rv" id="rec-base">${krw(rec.baseline)}</span>
      </div>
      <div class="rec-row rec-extra">
        <span class="rk">추가 매수 (${tier.label})</span>
        <span class="rv" id="rec-extra">${rec.extra === 0 ? "—" : "+ " + krw(rec.extra)}</span>
      </div>
      <div class="rec-row rec-total">
        <span class="rk">합계</span>
        <span class="rv" id="rec-total">${krw(rec.total)}</span>
      </div>
    </div>

    <div class="rec-meta">
      <div class="rec-meta-box">
        <span class="rec-meta-k">시장 상태</span>
        <span class="rec-meta-v" style="color:${loading ? "rgba(255,255,255,.4)" : tc}">${loading ? "—" : tier.label}</span>
      </div>
      <div class="rec-meta-box">
        <span class="rec-meta-k">공포 점수</span>
        <span class="rec-meta-v" style="color:${loading ? "rgba(255,255,255,.4)" : tc}">${loading ? "—" : score.total + "/100"}</span>
      </div>
    </div>
  </div>

  <!-- 등급 테이블 -->
  <div class="tier-list">
    ${TIERS.map(t => {
      const isActive = t === tier && !loading;
      return `<div class="tier-row ${isActive ? "active" : ""}" style="${isActive ? `border-color:${t.color};background:${t.bg};` : ""}">
        <div class="tier-left">
          <span class="tier-icon">${t.icon}</span>
          <div>
            <div class="tier-name" style="${isActive ? `color:${t.color};` : ""}">${t.label}</div>
            <div class="tier-sub">점수 ${t.min}–${t.max === 101 ? 100 : t.max} · ${t.desc}</div>
          </div>
        </div>
        <div class="tier-extra" style="${isActive ? `color:${t.color};` : ""}">
          ${t.extra === 0 ? "추가 없음" : "+" + Math.round(t.extra/10000) + "만원"}
        </div>
      </div>`;
    }).join("")}
  </div>
</section>

<div class="foot">
  데이터: Anthropic AI 실시간 검색 → CNN / CBOE / NASDAQ<br/>
  5분마다 자동 갱신 · 약 15–20분 지연 가능 · 투자 자문 아님
</div>
`;

  // ── 이벤트 바인딩 ─────────────────────────────────────────
  document.getElementById("btnRefresh")?.addEventListener("click", loadAll);

  const inp = document.getElementById("inp-weekly");
  if (inp) {
    inp.addEventListener("input", e => {
      const v = Math.max(0, Number(e.target.value) || 0);
      state.weeklyKRW = v;
      setLS("weeklyKRW", String(v));
      // 화면만 부분 업데이트 (전체 re-render 없이)
      const newRec = calcRec(v, state.fg?.value, state.vix?.value, state.ndx?.drawdown);
      const t = newRec.tier;
      const el = id => document.getElementById(id);
      if (el("rec-amount")) {
        el("rec-amount").textContent = krw(newRec.total);
        el("rec-amount").style.color = state.loading ? "rgba(255,255,255,.3)" : t.color;
      }
      if (el("rec-base"))  el("rec-base").textContent  = krw(newRec.baseline);
      if (el("rec-extra")) el("rec-extra").textContent = newRec.extra === 0 ? "—" : "+ " + krw(newRec.extra);
      if (el("rec-total")) el("rec-total").textContent = krw(newRec.total);
    });
  }
}

// ── 초기화 ────────────────────────────────────────────────────
render();
loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>
