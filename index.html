<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Market Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #f5f5f7; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  button { font-family: inherit; cursor: pointer; }
  /* Hero */
  .hero { padding: 28px 20px 28px; text-align: center; }

.market-fear{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#86efac;}
.market-greed{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fca5a5;}
.market-neutral{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#93c5fd;}
.recommend{position:sticky;top:12px;z-index:5;}
  .hero h1 { font-size: clamp(36px, 11vw, 64px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin: 0 0 14px; transition: color .6s; }
  .hero p { font-size: clamp(16px, 4.5vw, 22px); color: #424245; line-height: 1.4; margin: 0 auto; max-width: 560px; }
  .badge-row { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; font-size: 12px; color: #6e6e73; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #fff; border: 1px solid #e5e5ea; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.live { background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 2s infinite; }
  .dot.partial { background: #f59e0b; }
  .dot.fail { background: #ef4444; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)} 70%{box-shadow:0 0 0 8px rgba(34,197,94,0)} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0)} }
  /* Section */
  .section { max-width: 1100px; margin: 0 auto; padding: 12px 16px 20px; }
  .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } .section { padding: 16px 24px; } }
  .card { background: #fff; border-radius: 18px; padding: 18px 18px 16px; border: 1px solid #ececf0; }
  .card .label { font-size: 12px; color: #6e6e73; letter-spacing: 0.02em; text-transform: uppercase; }
  .card .sub { font-size: 13px; color: #86868b; margin-top: 2px; }
  .card .value { font-size: clamp(34px, 9vw, 44px); font-weight: 700; letter-spacing: -0.02em; margin: 10px 0 6px; line-height: 1; }
  .card .status { font-size: 14px; font-weight: 600; }
  .card .source { margin-top: 10px; font-size: 11px; color: #86868b; display: flex; justify-content: space-between; align-items: center; }
  .bar { width: 100%; height: 6px; background: #f0f0f3; border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; border-radius: 999px; transition: width .8s ease; }
  /* Dark stats */
  .dark { background:#f5f5f7;color:#1d1d1f;padding:20px 16px 36px; }
  .dark-inner { max-width:1100px;margin:0 auto;border-radius:24px;overflow:hidden;border:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(2,1fr);box-shadow:0 10px 30px rgba(0,0,0,.06);background:#fff; }
  @media (min-width: 720px) { .dark-inner { grid-template-columns: repeat(4, 1fr); } }
  .stat { padding:28px 20px;background:#fff;border-right:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;transition:.2s ease; }
.stat:hover{background:#fafafa;}
  .stat .k { font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.04em; }
  .stat .v { font-size: clamp(22px, 6vw, 30px); font-weight: 700; margin-top: 6px; line-height: 1.1; }
  .stat .s { font-size:12px;color:#6b7280;margin-top:4px;line-height:1.5; }
  /* Strategy */
  .strategy { background: #fff; }
  .strategy h2 { font-size: clamp(22px, 6vw, 28px); font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
  .strategy .lead { color: #6e6e73; font-size: 14px; margin: 0 0 14px; }
  .invest-box { background: #f5f5f7; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .invest-box label { display: block; font-size: 12px; color: #6e6e73; margin-bottom: 6px; }
  .invest-input { width: 100%; padding: 12px 14px; font-size: 18px; font-weight: 600; border: 1px solid #d2d2d7; border-radius: 10px; background: #fff; color: #1d1d1f; outline: none; }
  .invest-input:focus { border-color: #0071e3; }
  .invest-hint { font-size: 12px; color: #86868b; margin-top: 6px; }
  .recommend { background: linear-gradient(135deg,#0a84ff,#0071e3); color: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .recommend .rl { font-size: 12px; opacity: .85; text-transform: uppercase; letter-spacing: .04em; text-align:center; }
  .recommend .rv { font-size: clamp(28px, 8vw, 38px); font-weight: 700; margin: 8px 0 4px; letter-spacing: -.02em; text-align:center; }
  .recommend .rs { font-size: 13px; opacity: .9; text-align:center; }
  .tier-list { display: grid; gap: 8px; }
  .tier { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 12px; background: #fafafc; border: 1px solid #ececf0; gap: 10px; }
  .tier.active { background: #eaf4ff; border-color: #0a84ff; }
  .tier .tl { font-size: 13px; font-weight: 600; }
  .tier .tr { font-size: 12px; color: #6e6e73; }
  .tier .tm { font-size: 14px; font-weight: 700; color: #0a84ff; }

  .tier-fear-extreme{background:#dcfce7;border-color:#22c55e;}
  .tier-fear{background:#ecfccb;border-color:#84cc16;}
  .tier-neutral{background:#eff6ff;border-color:#60a5fa;}
  .tier-greed{background:#fef3c7;border-color:#f59e0b;}
  .tier-greed-extreme{background:#fee2e2;border-color:#ef4444;}

  /* Buttons */
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn { flex: 1 1 140px; padding: 12px 14px; border-radius: 10px; border: 1px solid #d2d2d7; background: #fff; color: #1d1d1f; font-size: 14px; font-weight: 600; }
  .btn:active { background: #f0f0f3; }
  .btn.primary { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
  /* Alerts */
  .alert { max-width: 1100px; margin: 0 auto 8px; padding: 10px 14px; background: #fff5f5; border: 1px solid #fecaca; color: #991b1b; border-radius: 12px; font-size: 13px; }
  .alert ul { margin: 4px 0 0; padding-left: 18px; }
  /* Footer */
  .foot { text-align: center; color: #86868b; font-size: 12px; padding: 28px 16px 40px; line-height: 1.6; }
  .foot a { color: #0a84ff; text-decoration: none; }
  /* Safe area for iOS */
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

.info-note{
  margin-top:14px;
  font-size:13px;
  color:rgba(255,255,255,.88);
  line-height:1.7;
  text-align:center;
}
.market-state{
  display:flex;
  justify-content:space-between;
  align-items:stretch;
  gap:12px;
  margin-top:10px;
}
.market-state .state-box,
.market-state .action-box{
  flex:1;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.28);
  border-radius:14px;
  padding:16px;
  text-align:center;
  backdrop-filter: blur(10px);
}
.market-state .t{
  font-size:11px;
  color:rgba(255,255,255,.75);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.market-state .v{
  margin-top:8px;
  font-size:20px;
  font-weight:700;
  color:#fff;
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===========================================================
   Market Dashboard — vanilla JS, mobile-optimized, KRW based
   Fetches: CNN Fear & Greed, VIX, NASDAQ-100 (QQQ as proxy)
   =========================================================== */

// ----- Free CORS proxies (rotated) -----
const PROXIES = [
  (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  (u) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  (u) => `https://thingproxy.freeboard.io/fetch/${u}`,
  (u) => `https://cors.eu.org/${u}`,
  (u) => `https://proxy.cors.sh/${u}`,
];

async function fetchViaProxies(url, asText = false, timeout = 8000) {
  let lastErr = null;
  for (const wrap of PROXIES) {
    const proxied = wrap(url);
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), timeout);
      const r = await fetch(proxied, { signal: ctl.signal, headers: { "Accept": "*/*" }});
      clearTimeout(t);
      if (!r.ok) { lastErr = new Error(`HTTP ${r.status} via ${new URL(proxied).host}`); continue; }
      return asText ? await r.text() : await r.json();
    } catch (e) { lastErr = e; continue; }
  }
  throw lastErr || new Error("모든 프록시 실패");
}

// ----- Data fetchers -----
async function fetchFearGreed() {
  const url = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata";
  const j = await fetchViaProxies(url, false);
  const fg = j?.fear_and_greed;
  if (!fg) throw new Error("CNN 응답 형식 오류");
  return { value: Math.round(fg.score), label: fg.rating, source: "CNN" };
}

const fgLabelKo = (label) => ({
  "extreme fear": "극단적 공포", "fear": "공포", "neutral": "중립",
  "greed": "탐욕", "extreme greed": "극단적 탐욕"
}[String(label || "").toLowerCase()] || label || "—");

// VIX — multiple strategies
async function fetchVIX() {
  const errors = [];
  // 1) Yahoo chart via proxies
  try {
    const u = "https://query1.finance.yahoo.com/v8/finance/chart/^VIX?interval=1d&range=5d";
    const j = await fetchViaProxies(u, false);
    const r = j?.chart?.result?.[0];
    const meta = r?.meta;
    const px = meta?.regularMarketPrice ?? r?.indicators?.quote?.[0]?.close?.filter(Boolean).pop();
    if (px) return { value: Number(px), source: "Yahoo" };
  } catch (e) { errors.push("Yahoo: " + (e.message || e)); }

  // 2) Yahoo query2 endpoint
  try {
    const u = "https://query2.finance.yahoo.com/v7/finance/quote?symbols=^VIX";
    const j = await fetchViaProxies(u, false);
    const px = j?.quoteResponse?.result?.[0]?.regularMarketPrice;
    if (px) return { value: Number(px), source: "Yahoo2" };
  } catch (e) { errors.push("Yahoo2: " + (e.message || e)); }

  // 3) Stooq CSV (often has permissive CORS but use proxy to be safe)
  try {
    const u = "https://stooq.com/q/l/?s=^vix&f=sd2t2ohlcv&h&e=csv";
    const txt = await fetchViaProxies(u, true);
    const lines = txt.trim().split(/\r?\n/);
    if (lines.length >= 2) {
      const cols = lines[1].split(",");
      const close = parseFloat(cols[6]);
      if (!isNaN(close) && close > 0) return { value: close, source: "Stooq" };
    }
  } catch (e) { errors.push("Stooq: " + (e.message || e)); }

  // 4) Stooq direct (no proxy) — last resort
  try {
    const u = "https://stooq.com/q/l/?s=^vix&f=sd2t2ohlcv&h&e=csv";
    const r = await fetch(u);
    if (r.ok) {
      const txt = await r.text();
      const lines = txt.trim().split(/\r?\n/);
      if (lines.length >= 2) {
        const cols = lines[1].split(",");
        const close = parseFloat(cols[6]);
        if (!isNaN(close) && close > 0) return { value: close, source: "Stooq*" };
      }
    }
  } catch (e) { errors.push("Stooq direct: " + (e.message || e)); }

  // 5) FMP demo endpoint (free, sometimes available)
  try {
    const u = "https://financialmodelingprep.com/api/v3/quote/^VIX?apikey=demo";
    const j = await fetchViaProxies(u, false);
    const px = j?.[0]?.price;
    if (px) return { value: Number(px), source: "FMP" };
  } catch (e) { errors.push("FMP: " + (e.message || e)); }

  throw new Error(errors.join(" | "));
}

async function fetchNDX() {
  const errors = [];
  try {
    const u = "https://query1.finance.yahoo.com/v8/finance/chart/^NDX?interval=1d&range=1y";
    const j = await fetchViaProxies(u, false);
    const r = j?.chart?.result?.[0];
    const meta = r?.meta;
    const closes = (r?.indicators?.quote?.[0]?.close || []).filter(v => v != null);
    const price = meta?.regularMarketPrice ?? closes[closes.length - 1];
    const high52 = meta?.fiftyTwoWeekHigh ?? Math.max(...closes);
    if (price && high52) {
      const dd = (price / high52 - 1) * 100;
      return { value: Number(price), high52: Number(high52), drawdown: dd, source: "Yahoo" };
    }
  } catch (e) { errors.push("Yahoo: " + (e.message || e)); }

  try {
    const u = "https://stooq.com/q/l/?s=^ndx&f=sd2t2ohlcv&h&e=csv";
    const txt = await fetchViaProxies(u, true);
    const lines = txt.trim().split(/\r?\n/);
    if (lines.length >= 2) {
      const cols = lines[1].split(",");
      const close = parseFloat(cols[6]);
      if (!isNaN(close)) return { value: close, high52: null, drawdown: null, source: "Stooq" };
    }
  } catch (e) { errors.push("Stooq: " + (e.message || e)); }

  throw new Error(errors.join(" | "));
}

// ----- DCA logic -----
const BASE_WEEKLY = 100000;
const MAX_EXTRA_BUY = 400000;

function fgScore(fg) {
  if (fg == null) return 50;
  return 100 - fg;
}

function vixScore(vix) {
  if (vix == null) return 50;
  if (vix >= 40) return 95;
  if (vix >= 32) return 80;
  if (vix >= 25) return 65;
  if (vix >= 18) return 45;
  return 20;
}

function ndxScore(drawdown) {
  if (drawdown == null) return 50;
  if (drawdown <= -20) return 95;
  if (drawdown <= -12) return 80;
  if (drawdown <= -7) return 65;
  if (drawdown <= -3) return 45;
  return 20;
}

function marketScore(fg, vix, drawdown) {
  const fgS = fgScore(fg);
  const vixS = vixScore(vix);
  const ndxS = ndxScore(drawdown);

  // 기본 가중 평균
  let total = Math.round(
    (fgS * 0.4) +
    (vixS * 0.25) +
    (ndxS * 0.35)
  );

  // 강한 공포 시그널 우선 반영
  if (fg != null && fg < 25) {
    total = Math.max(total, 75);
  } else if (fg != null && fg < 40) {
    total = Math.max(total, 62);
  }

  // 변동성 급등 반영
  if (vix != null && vix >= 35) {
    total = Math.max(total, 82);
  } else if (vix != null && vix >= 28) {
    total = Math.max(total, 68);
  }

  // 실제 가격 하락 강하게 반영
  if (drawdown != null && drawdown <= -20) {
    total = Math.max(total, 90);
  } else if (drawdown != null && drawdown <= -12) {
    total = Math.max(total, 75);
  } else if (drawdown != null && drawdown <= -7) {
    total = Math.max(total, 60);
  }

  return {
    total,
    fgS,
    vixS,
    ndxS
  };
}

const MARKET_TIERS = [
  { min: 0,  max: 20, label: "과열", color:"#dc2626", extra:0, desc:"추가매수 없음" },
  { min: 20, max: 40, label: "경계", color:"#f59e0b", extra:0, desc:"기본 적립 유지" },
  { min: 40, max: 60, label: "중립", color:"#2563eb", extra:0, desc:"기본 적립 유지" },
  { min: 60, max: 80, label: "매수 강화", color:"#16a34a", extra:150000, desc:"공포 확대 구간" },
  { min: 80, max: 101, label: "공격적 매수", color:"#15803d", extra:300000, desc:"극단적 공포 구간" },
];

function marketTier(score) {
  return MARKET_TIERS.find(t => score >= t.min && score < t.max) || MARKET_TIERS[2];
}

function weeklyRecommendation(base, fg, vix, drawdown) {
  const score = marketScore(fg, vix, drawdown);
  const tier = marketTier(score.total);

  let additionalBuy = tier.extra;

  if (score.total >= 90) additionalBuy = 400000;

  additionalBuy = Math.min(MAX_EXTRA_BUY, additionalBuy);

  return {
    baseline: base,
    additionalBuy,
    total: base + additionalBuy,
    score,
    tier
  };
}

function signalOf(scoreObj) {
  if (!scoreObj) {
    return {
      label: "데이터 로딩 중",
      desc: "시장 데이터를 가져오는 중입니다.",
      color: "#86868b",
      mode:"neutral"
    };
  }

  const tier = marketTier(scoreObj.total);

  return {
    label: tier.label,
    desc: `통합 시장 점수 ${scoreObj.total}/100 · ${tier.desc}`,
    color: tier.color,
    mode:
      scoreObj.total >= 60 ? "fear" :
      scoreObj.total < 40 ? "greed" :
      "neutral"
  };
}

// ----- KRW formatter -----
const KRW = (n) => "₩" + Math.round(n).toLocaleString("ko-KR");
const fmtKRW = (n) => Math.round(n).toLocaleString("ko-KR") + "원";

// ----- Color helpers -----
const fgColor = (v) => v == null ? "#86868b" : v < 25 ? "#22c55e" : v < 45 ? "#16a34a" : v < 55 ? "#0a84ff" : v < 75 ? "#f59e0b" : "#ef4444";
const vixColor = (v) => v == null ? "#86868b" : v >= 35 ? "#ef4444" : v >= 25 ? "#f59e0b" : v >= 18 ? "#0a84ff" : "#22c55e";
const ddColor = (v) => v == null ? "#86868b" : v <= -20 ? "#ef4444" : v <= -10 ? "#f59e0b" : v <= -5 ? "#0a84ff" : "#22c55e";

// ----- State -----
let isRefreshing = false;

let state = {
  loading: true, lastUpdate: null,
  fg: null, vix: null, ndx: null,
  errors: [],
  weeklyKRW: Number(localStorage.getItem("weeklyKRW") || 100000),
};

// ----- Render -----
function render() {
  const { loading, fg, vix, ndx, errors, weeklyKRW, lastUpdate } = state;
  const strategy = weeklyRecommendation(weeklyKRW, fg?.value, vix?.value, ndx?.drawdown);
  const sig = signalOf(strategy.score);
  const tier = strategy.tier;
  const recommend = strategy.total;
  const successCount = [fg, vix, ndx].filter(Boolean).length;
  const livePill = loading ? { c: "fail", t: "로딩 중…" }
                  : successCount === 3 ? { c: "live", t: "LIVE" }
                  : successCount > 0 ? { c: "partial", t: "PARTIAL" }
                  : { c: "fail", t: "OFFLINE" };
  const tStr = lastUpdate ? new Date(lastUpdate).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "—";

  document.getElementById("app").innerHTML = `
    <header class="hero ${sig.mode === "fear" ? "market-fear" : sig.mode === "greed" ? "market-greed" : "market-neutral"}">
      <h1 style="color:${loading ? "#86868b" : sig.color}">${loading ? "Loading…" : sig.label}</h1>
      <p>${loading ? "시장 데이터를 가져오는 중입니다." : sig.desc}</p>
      <div class="badge-row">
        <button class="pill" id="liveRefresh" ${isRefreshing ? "disabled" : ""} style="border:none;font-weight:600;opacity:${isRefreshing ? ".6":"1"};"><span class="dot ${livePill.c}"></span>${isRefreshing ? "UPDATING..." : livePill.t}</button>
        <span class="pill">⏱ ${tStr}</span>
      </div>
    </header>

    ${errors.length ? `<div class="alert" role="status">
      <strong>일부 데이터 가져오기 실패</strong>
      <ul>${errors.map(e => `<li>${e}</li>`).join("")}</ul>
    </div>` : ""}

    

    <section class="dark" style="padding-top:8px;">
      <div class="dark-inner">
        <div class="stat">
          <div class="k">통합 시장 점수</div>
          <div class="v" style="color:${sig.color}">${strategy.score.total}</div>
          <div class="s">${tier.label} · ${tier.desc}</div>
        </div>

        <div class="stat">
          <div class="k">Fear & Greed</div>
          <div class="v" style="color:${fgColor(fg?.value)}">${fg?.value ?? "—"}</div>
          <div class="s">
            ${fg ? fgLabelKo(fg.label) : "데이터 없음"}<br/>
            출처: ${fg ? fg.source : "-"}
          </div>
        </div>

        <div class="stat">
          <div class="k">VIX</div>
          <div class="v" style="color:${vixColor(vix?.value)}">${vix ? vix.value.toFixed(1) : "—"}</div>
          <div class="s">
            시장 변동성<br/>
            출처: ${vix ? vix.source : "-"}
          </div>
        </div>

        <div class="stat">
          <div class="k">NASDAQ 100</div>
          <div class="v">${ndx ? ndx.value.toLocaleString("en-US",{maximumFractionDigits:0}) : "—"}</div>
          <div class="s">
            ${ndx?.drawdown != null ? "고점 대비 " + ndx.drawdown.toFixed(1) + "%" : "데이터 없음"}<br/>
            출처: ${ndx ? ndx.source : "-"}
          </div>
        </div>
      </div>
    </section>

    <section class="section strategy">
      <h2>통합 시장 점수 기반 DCA 전략</h2>
      <p class="lead">Fear & Greed · VIX · NASDAQ 하락률을 통합 분석해 공포 구간에서만 추가매수하는 자동 적립 시스템</p>

      <div class="invest-box">
        <label for="weekly">주간 기본 투자금 (원)</label>
        <input id="weekly" class="invest-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" step="10000" value="${weeklyKRW}" />
        
      </div>

      <div class="recommend">
        <div class="rl">이번 주 총 매수 권장액</div>
<div class="rv">${fmtKRW(recommend)}</div>
<div class="rs">기본 적립 ${fmtKRW(strategy.baseline)} + 추가 매수 ${fmtKRW(strategy.additionalBuy)}</div>

<div class="market-state">
  <div class="state-box">
    <div class="t">현재 시장 상태</div>
    <div class="v">${tier.label}</div>
  </div>

  <div class="action-box">
    <div class="t">현재 추천 행동</div>
    <div class="v">+${Math.round(strategy.additionalBuy/10000)}만원 추가매수</div>
  </div>
</div>

<div class="info-note">
시장심리 ${strategy.score.fgS} = Fear & Greed 역산 ·
변동성 ${strategy.score.vixS} = VIX 기반 ·
하락률 ${strategy.score.ndxS} = NASDAQ 52주 고점 대비 하락률
</div>
      </div>

      <div class="tier-list">
        ${MARKET_TIERS.map(t => `
          <div class="tier ${
            t.label === "공격적 매수" ? "tier-fear-extreme" :
            t.label === "매수 강화" ? "tier-fear" :
            t.label === "중립" ? "tier-neutral" :
            t.label === "경계" ? "tier-greed" :
            "tier-greed-extreme"
          } ${t === tier && !loading ? "active" : ""}">
            <div>
              <div class="tl">${t.label}</div>
              <div class="tr">시장점수 ${t.min}–${t.max === 101 ? 100 : t.max} · ${t.desc}</div>
            </div>
            <div class="tm">+${Math.round(t.extra/10000)}만원</div>
          </div>
        `).join("")}
      </div>

      <div class="btn-row">
        <button class="btn" id="reset">기본값 (10만원)</button>
      </div>
    </section>

    <div class="foot">
      데이터: CNN Business · Yahoo Finance · Stooq.com<br/>
      약 15–20분 지연 · 5분마다 자동 갱신 · 본 페이지는 투자 자문이 아닙니다.
    </div>
  `;

  // bind events
  const inp = document.getElementById("weekly");
  if (inp) {
    inp.addEventListener("input", (e) => {
      const v = Math.max(0, Number(e.target.value) || 0);
      state.weeklyKRW = v;
      localStorage.setItem("weeklyKRW", String(v));
      // soft re-render of recommend only
      const rec = document.querySelector(".recommend .rv");
      if (rec) rec.textContent = fmtKRW(v * tier.mult * ov);
    });
  }
  
  document.getElementById("liveRefresh")?.addEventListener("click", loadAll);

  document.getElementById("reset")?.addEventListener("click", () => {
    state.weeklyKRW = 100000; localStorage.setItem("weeklyKRW", "100000"); render();
  });
}



// ----- Loader -----
async function loadAll() {
  if (isRefreshing) return;
  isRefreshing = true;
  state.loading = true;
  state.errors = [];
  render();
  const [r1, r2, r3] = await Promise.allSettled([fetchFearGreed(), fetchVIX(), fetchNDX()]);
  const errs = [];
  if (r1.status === "fulfilled") state.fg = r1.value; else { state.fg = null; errs.push("F&G: " + (r1.reason?.message || r1.reason)); }
  if (r2.status === "fulfilled") state.vix = r2.value; else { state.vix = null; errs.push("VIX: " + (r2.reason?.message || r2.reason)); }
  if (r3.status === "fulfilled") state.ndx = r3.value; else { state.ndx = null; errs.push("NDX: " + (r3.reason?.message || r3.reason)); }
  state.errors = errs;
  state.loading = false;
  state.lastUpdate = Date.now();
  isRefreshing = false;
  render();
}

// init
render();
loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>
